<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Savings Goals - SpendWise</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .goal-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow-sm);
    }
  </style>
</head>
<body>
  <div class="app-container">
    <aside class="sidebar">
      <div class="brand"><div class="brand-icon">💼</div><span>Spend<span>Wise</span></span></div>
      <nav class="nav-links">
        <a href="/dashboard.html" class="nav-item">📊 Dashboard</a>
        <a href="/transactions.html" class="nav-item">💳 Transactions</a>
        <a href="/receipt-scanner.html" class="nav-item">📷 Receipt Scanner</a>
        <a href="/budgets.html" class="nav-item">🎯 Budgets</a>
        <a href="/analytics.html" class="nav-item">📈 Analytics</a>
        <a href="/goals.html" class="nav-item active">🏆 Savings Goals</a>
        <a href="/recurring.html" class="nav-item">🔄 Recurring Bills</a>
        <a href="/reports.html" class="nav-item">📑 Reports</a>
        <a href="/settings.html" class="nav-item">⚙️ Settings</a>
      </nav>
    </aside>

    <div class="main-content">
      <header class="topbar">
        <div><span style="font-size: 0.85rem; color: var(--text-muted); font-weight: 500;">SpendWise v1.0 • Pure HTML</span></div>
        <div class="topbar-right">
          <button class="theme-toggle-btn" onclick="toggleTheme()">🌓</button>
          <div class="user-pill"><div class="user-avatar" id="userAvatar">U</div><span id="userNameDisplay">User</span></div>
          <button class="btn-signout" onclick="logout()">Sign Out</button>
        </div>
      </header>

      <main class="content-body">
        <div class="page-header">
          <div>
            <h1 class="page-title">Savings Goals</h1>
            <p class="page-subtitle">Track targets for vehicles, travel, emergency funds, and major purchases</p>
          </div>
          <div>
            <button class="btn-primary" onclick="openGoalModal()">+ New Goal</button>
          </div>
        </div>

        <div id="goalsGrid" class="grid-cards">
          <div class="card" style="grid-column: 1 / -1; text-align: center; color: var(--text-muted);">
            Loading goals...
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Create Goal Modal -->
  <div id="goalModal" class="modal-overlay">
    <div class="modal-content">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
        <h3 style="font-size: 1.15rem; font-weight: 700;">Create Savings Goal</h3>
        <button onclick="closeGoalModal()" style="background: none; border: none; font-size: 1.2rem; cursor: pointer;">✕</button>
      </div>

      <form id="goalForm">
        <div class="form-group">
          <label class="form-label">Goal Title</label>
          <input type="text" id="goalTitle" class="form-input" required placeholder="e.g. New Laptop, Vacation Fund">
        </div>
        <div class="form-group">
          <label class="form-label">Target Amount</label>
          <input type="number" step="0.01" id="goalTarget" class="form-input" required placeholder="50000.00">
        </div>
        <div class="form-group">
          <label class="form-label">Initial Amount Already Saved</label>
          <input type="number" step="0.01" id="goalCurrent" class="form-input" value="0">
        </div>
        <div class="form-group">
          <label class="form-label">Target Deadline</label>
          <input type="date" id="goalDeadline" class="form-input" required>
        </div>
        <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px;">
          <button type="button" class="btn-secondary" onclick="closeGoalModal()">Cancel</button>
          <button type="submit" class="btn-primary">Create Goal</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script>
    requireAuth();
    renderTopbarUser();

    async function loadGoals() {
      const grid = document.getElementById('goalsGrid');
      const res = await apiRequest('/goals');
      if (res && res.success && res.data.length > 0) {
        grid.innerHTML = res.data.map(g => {
          const target = parseFloat(g.target_amount) || 1;
          const current = parseFloat(g.current_amount) || 0;
          const pct = Math.min(100, Math.round((current / target) * 100));

          return `
            <div class="goal-card">
              <div style="display: flex; justify-content: space-between; align-items: start;">
                <h3 style="font-size: 1.1rem; font-weight: 700;">${escapeHtml(g.title)}</h3>
                <button onclick="deleteGoal(${g.id})" style="background: none; border: none; color: var(--danger); cursor: pointer;">✕</button>
              </div>
              <div style="margin: 14px 0 6px; font-size: 1.3rem; font-weight: 700; color: var(--primary);">
                ${formatCurrency(current)}
              </div>
              <div style="font-size: 0.8rem; color: var(--text-muted);">
                Target: ${formatCurrency(target)} • Deadline: ${g.deadline || 'No deadline'}
              </div>
              <div style="height: 8px; background: var(--border); border-radius: 999px; overflow: hidden; margin: 12px 0 8px;">
                <div style="height: 100%; width: ${pct}%; background: var(--success); border-radius: 999px;"></div>
              </div>
              <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 14px;">
                <span style="font-size: 0.8rem; font-weight: 600; color: var(--success);">${pct}% achieved</span>
                <button class="btn-secondary" style="padding: 4px 10px; font-size: 0.75rem;" onclick="addFunds(${g.id})">+ Add Funds</button>
              </div>
            </div>
          `;
        }).join('');
      } else {
        grid.innerHTML = `
          <div class="card" style="grid-column: 1 / -1; text-align: center; padding: 40px;">
            <p style="color: var(--text-muted); margin-bottom: 12px;">No savings goals set yet.</p>
            <button class="btn-primary" onclick="openGoalModal()">+ Create Your First Goal</button>
          </div>
        `;
      }
    }

    async function addFunds(id) {
      const amtStr = prompt('Enter contribution amount to deposit into this goal:');
      if (!amtStr) return;
      const amount = parseFloat(amtStr);
      if (isNaN(amount) || amount <= 0) return alert('Please enter a valid amount');

      const res = await apiRequest(`/goals/${id}/contribute`, {
        method: 'POST',
        body: JSON.stringify({ amount })
      });

      if (res && res.success) {
        loadGoals();
      } else {
        alert(res?.message || 'Failed to add funds');
      }
    }

    async function deleteGoal(id) {
      if (confirm('Delete this savings goal?')) {
        await apiRequest(`/goals/${id}`, { method: 'DELETE' });
        loadGoals();
      }
    }

    function openGoalModal() { document.getElementById('goalModal').classList.add('open'); }
    function closeGoalModal() { document.getElementById('goalModal').classList.remove('open'); }

    document.getElementById('goalForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const title = document.getElementById('goalTitle').value;
      const targetAmount = parseFloat(document.getElementById('goalTarget').value);
      const currentAmount = parseFloat(document.getElementById('goalCurrent').value) || 0;
      const deadline = document.getElementById('goalDeadline').value;

      const res = await apiRequest('/goals', {
        method: 'POST',
        body: JSON.stringify({ title, targetAmount, currentAmount, deadline })
      });

      if (res && res.success) {
        closeGoalModal();
        document.getElementById('goalForm').reset();
        loadGoals();
      } else {
        alert(res?.message || 'Failed to create goal');
      }
    });

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
    }

    loadGoals();
  </script>
</body>
</html>
