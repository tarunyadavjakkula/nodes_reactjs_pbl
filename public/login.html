<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - SpendWise</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .auth-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .auth-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 36px;
      width: 100%;
      max-width: 400px;
      box-shadow: var(--shadow);
    }
    .auth-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 24px;
    }
    .alert-error {
      background: rgba(239, 68, 68, 0.15);
      color: var(--danger);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-bottom: 16px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="brand-icon">💼</div>
        <span>Spend<span>Wise</span></span>
      </div>
      <h2 style="font-size: 1.25rem; font-weight: 700; margin-bottom: 8px;">Sign In</h2>
      <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 20px;">
        Access your personal financial intelligence dashboard
      </p>

      <div id="errorAlert" class="alert-error"></div>

      <form id="loginForm">
        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input type="email" id="email" class="form-input" placeholder="name@example.com" required value="tarun@gmail.com">
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" class="form-input" placeholder="••••••••" required>
        </div>
        <button type="submit" id="submitBtn" class="btn-primary" style="width: 100%; justify-content: center; margin-top: 10px;">
          Sign In
        </button>
      </form>

      <p style="font-size: 0.85rem; text-align: center; color: var(--text-muted); margin-top: 20px;">
        Don't have an account? <a href="/register.html" style="color: var(--primary); font-weight: 600;">Sign up</a>
      </p>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script>
    // Redirect if already logged in
    if (getToken()) {
      window.location.href = '/dashboard.html';
    }

    const form = document.getElementById('loginForm');
    const errorAlert = document.getElementById('errorAlert');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorAlert.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Signing in...';

      try {
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();
        if (res.ok && data.success) {
          localStorage.setItem('spendwise_token', data.data.token);
          setUser(data.data.user);
          window.location.href = '/dashboard.html';
        } else {
          errorAlert.textContent = data.message || 'Login failed. Please check credentials.';
          errorAlert.style.display = 'block';
        }
      } catch (err) {
        errorAlert.textContent = 'Unable to connect to server. Please try again.';
        errorAlert.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign In';
      }
    });
  </script>
</body>
</html>
