<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Budgets - SpendWise</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .progress-bar {
      height: 10px;
      background: var(--border);
      border-radius: 999px;
      overflow: hidden;
      margin: 12px 0 8px;
    }
    .progress-fill {
      height: 100%;
      border-radius: 999px;
      transition: width 0.3s;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <aside class="sidebar">
      <div class="brand"><div class="brand-icon">💼</div><span>Spend<span>Wise</span></span></div>
      <nav class="nav-links">
        <a href="/dashboard.html" class="nav-item">📊 Dashboard</a>
        <a href="/transactions.html" class="nav-item">💳 Transactions</a>
        <a href="/receipt-scanner.html" class="nav-item">📷 Receipt Scanner</a>
        <a href="/budgets.html" class="nav-item active">🎯 Budgets</a>
        <a href="/analytics.html" class="nav-item">📈 Analytics</a>
        <a href="/goals.html" class="nav-item">🏆 Savings Goals</a>
        <a href="/recurring.html" class="nav-item">🔄 Recurring Bills</a>
        <a href="/reports.html" class="nav-item">📑 Reports</a>
        <a href="/settings.html" class="nav-item">⚙️ Settings</a>
      </nav>
    </aside>

    <div class="main-content">
      <header class="topbar">
        <div><span style="font-size: 0.85rem; color: var(--text-muted); font-weight: 500;">SpendWise v1.0 • Pure HTML</span></div>
        <div class="topbar-right">
          <button class="theme-toggle-btn" onclick="toggleTheme()">🌓</button>
          <div class="user-pill"><div class="user-avatar" id="userAvatar">U</div><span id="userNameDisplay">User</span></div>
          <button class="btn-signout" onclick="logout()">Sign Out</button>
        </div>
      </header>

      <main class="content-body">
        <div class="page-header">
          <div>
            <h1 class="page-title">Monthly Budgets</h1>
            <p class="page-subtitle">Track spending thresholds and limit category overspending</p>
          </div>
          <div style="display: flex; gap: 12px; align-items: center;">
            <input type="month" id="monthPicker" class="form-input" style="width: auto;">
            <button class="btn-primary" onclick="openAddBudgetModal()">+ Set Budget</button>
          </div>
        </div>

        <!-- Budget Cards Grid -->
        <div id="budgetsGrid" class="grid-cards">
          <div class="card" style="grid-column: 1 / -1; text-align: center; color: var(--text-muted);">
            Loading budgets...
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Add Budget Modal -->
  <div id="budgetModal" class="modal-overlay">
    <div class="modal-content">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
        <h3 style="font-size: 1.15rem; font-weight: 700;">Set Monthly Budget</h3>
        <button onclick="closeAddBudgetModal()" style="background: none; border: none; font-size: 1.2rem; cursor: pointer;">✕</button>
      </div>

      <form id="budgetForm">
        <div class="form-group">
          <label class="form-label">Category</label>
          <select id="budgetCategory" class="form-select" required></select>
        </div>
        <div class="form-group">
          <label class="form-label">Budget Limit Amount</label>
          <input type="number" step="0.01" id="budgetAmount" class="form-input" required placeholder="5000.00">
        </div>
        <div class="form-group">
          <label class="form-label">Warning Threshold (%)</label>
          <input type="number" id="budgetThreshold" class="form-input" value="80" required min="50" max="100">
        </div>
        <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px;">
          <button type="button" class="btn-secondary" onclick="closeAddBudgetModal()">Cancel</button>
          <button type="submit" class="btn-primary">Save Budget</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script>
    requireAuth();
    renderTopbarUser();

    const monthPicker = document.getElementById('monthPicker');
    monthPicker.value = new Date().toISOString().slice(0, 7);

    async function loadCategories() {
      const res = await apiRequest('/categories');
      if (res && res.success) {
        const select = document.getElementById('budgetCategory');
        select.innerHTML = res.data.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
      }
    }

    async function loadBudgets() {
      const month = monthPicker.value;
      const grid = document.getElementById('budgetsGrid');
      grid.innerHTML = '<div class="card" style="grid-column: 1 / -1; text-align: center;">Loading budgets...</div>';

      const res = await apiRequest(`/budgets?month=${month}`);
      if (res && res.success && res.data.budgets.length > 0) {
        grid.innerHTML = res.data.budgets.map(b => {
          const pct = Math.min(100, b.percentage);
          const color = b.isExceeded ? 'var(--danger)' : (b.isWarning ? 'var(--warning)' : 'var(--success)');
          return `
            <div class="card">
              <div style="display: flex; justify-content: space-between; align-items: start;">
                <div>
                  <div class="card-title">${escapeHtml(b.category_name)}</div>
                  <div class="card-value" style="font-size: 1.3rem;">${formatCurrency(b.spent)}</div>
                </div>
                <button onclick="deleteBudget(${b.id})" style="background: none; border: none; color: var(--danger); cursor: pointer; font-size: 0.9rem;">✕</button>
              </div>
              <div class="progress-bar">
                <div class="progress-fill" style="width: ${pct}%; background: ${color};"></div>
              </div>
              <div style="display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--text-muted);">
                <span>Limit: ${formatCurrency(b.amount)}</span>
                <span>${b.percentage}% used</span>
              </div>
            </div>
          `;
        }).join('');
      } else {
        grid.innerHTML = `
          <div class="card" style="grid-column: 1 / -1; text-align: center; padding: 40px;">
            <p style="color: var(--text-muted); margin-bottom: 12px;">No budgets configured for ${month}.</p>
            <button class="btn-primary" onclick="openAddBudgetModal()">+ Create Budget for ${month}</button>
          </div>
        `;
      }
    }

    async function deleteBudget(id) {
      if (confirm('Delete this budget limit?')) {
        await apiRequest(`/budgets/${id}`, { method: 'DELETE' });
        loadBudgets();
      }
    }

    function openAddBudgetModal() {
      document.getElementById('budgetModal').classList.add('open');
    }

    function closeAddBudgetModal() {
      document.getElementById('budgetModal').classList.remove('open');
    }

    monthPicker.addEventListener('change', loadBudgets);

    document.getElementById('budgetForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const categoryId = parseInt(document.getElementById('budgetCategory').value);
      const amount = parseFloat(document.getElementById('budgetAmount').value);
      const warningThreshold = parseFloat(document.getElementById('budgetThreshold').value);
      const month = monthPicker.value;

      const res = await apiRequest('/budgets', {
        method: 'POST',
        body: JSON.stringify({ categoryId, amount, month, warningThreshold })
      });

      if (res && res.success) {
        closeAddBudgetModal();
        document.getElementById('budgetForm').reset();
        loadBudgets();
      } else {
        alert(res?.message || 'Failed to set budget');
      }
    });

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
    }

    loadCategories();
    loadBudgets();
  </script>
</body>
</html>
