<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - SpendWise</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .auth-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .auth-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 36px;
      width: 100%;
      max-width: 440px;
      box-shadow: var(--shadow);
    }
    .auth-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 24px;
    }
    .alert-error {
      background: rgba(239, 68, 68, 0.15);
      color: var(--danger);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-bottom: 16px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-logo">
        <div class="brand-icon">💼</div>
        <span>Spend<span>Wise</span></span>
      </div>
      <h2 style="font-size: 1.25rem; font-weight: 700; margin-bottom: 8px;">Create Account</h2>
      <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 20px;">
        Join SpendWise and start tracking your wealth smartly
      </p>

      <div id="errorAlert" class="alert-error"></div>

      <form id="registerForm">
        <div class="form-group">
          <label class="form-label" for="name">Full Name</label>
          <input type="text" id="name" class="form-input" placeholder="Tarun Yadav" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input type="email" id="email" class="form-input" placeholder="name@example.com" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" class="form-input" placeholder="••••••••" required minlength="6">
        </div>
        <div class="form-group">
          <label class="form-label" for="currency">Default Currency</label>
          <select id="currency" class="form-select">
            <option value="INR" selected>INR (₹) - Indian Rupee</option>
            <option value="USD">USD ($) - US Dollar</option>
            <option value="EUR">EUR (€) - Euro</option>
            <option value="GBP">GBP (£) - British Pound</option>
            <option value="CAD">CAD ($) - Canadian Dollar</option>
          </select>
        </div>
        <button type="submit" id="submitBtn" class="btn-primary" style="width: 100%; justify-content: center; margin-top: 10px;">
          Create Account
        </button>
      </form>

      <p style="font-size: 0.85rem; text-align: center; color: var(--text-muted); margin-top: 20px;">
        Already have an account? <a href="/login.html" style="color: var(--primary); font-weight: 600;">Sign in</a>
      </p>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script>
    if (getToken()) { window.location.href = '/dashboard.html'; }

    const form = document.getElementById('registerForm');
    const errorAlert = document.getElementById('errorAlert');
    const submitBtn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorAlert.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Creating account...';

      try {
        const name = document.getElementById('name').value.trim();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const currency = document.getElementById('currency').value;

        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password, currency })
        });

        const data = await res.json();
        if (res.ok && data.success) {
          localStorage.setItem('spendwise_token', data.data.token);
          setUser(data.data.user);
          window.location.href = '/dashboard.html';
        } else {
          errorAlert.textContent = data.message || 'Registration failed.';
          errorAlert.style.display = 'block';
        }
      } catch (err) {
        errorAlert.textContent = 'Connection error. Please try again.';
        errorAlert.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Create Account';
      }
    });
  </script>
</body>
</html>
